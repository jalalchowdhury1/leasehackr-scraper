name: Historical Scraper
on:
  schedule:
    # Runs at 03:54 UTC (11:54 PM EDT prev day / 10:54 PM EST) every day.
    # Moved earlier from 07:04 on 2026-08-06 so this lands BEFORE the 09:00 UTC
    # (5:00 AM EDT) fleet-health check — see note 1 in AGENTS.md. GitHub starts
    # these ~2h35m late, so the real start is ~06:29 UTC.
    - cron: '54 3 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI
jobs:
  historical:
    name: Historical Sheet (scraper.py)
    runs-on: ubuntu-latest
    # No browser install any more (fetch is plain HTTP with an on-demand
    # Lightpanda fallback) — the whole job normally finishes in ~1 minute.
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
        cache: 'pip'
    - name: Validate required secrets
      run: |
        if [ -z "${{ secrets.SPREADSHEET_ID }}" ]; then
          echo "Error: SPREADSHEET_ID secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.GOOGLE_CREDENTIALS }}" ]; then
          echo "Error: GOOGLE_CREDENTIALS secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.TELEGRAM_TOKEN }}" ]; then
          echo "Error: TELEGRAM_TOKEN secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
          echo "Error: TELEGRAM_CHAT_ID secret is not set"
          exit 1
        fi
        echo "All required secrets are present"
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --retries 5 --timeout 60 -r requirements.txt
    - name: Run Historical Scraper
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper.py
