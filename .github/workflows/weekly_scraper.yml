name: Historical Scraper
on:
  schedule:
    # BACKSTOP only (2 Oct 2026). The primary is AWS EventBridge
    # `one-clock-leasehackr-historical`, cron(54 23 * * ? *) America/New_York
    # = 03:54 UTC (EDT) / 04:54 UTC (EST), dispatched via the gh-dispatcher
    # Lambda. GitHub's cron started this job 5-6.5h late (26 Sep-1 Oct), past
    # the 09:00 UTC fleet check. This backstop must trail AWS's LATER UTC
    # instant by >=30 min in both DST states (one-clock rule 1; race_audit.py).
    - cron: '30 5 * * *'
  workflow_dispatch: # AWS One Clock primary + manual runs
# AWS + backstop can both fire on one night. Queue, never overlap: two runs at
# once would both see the same deals as new (double Telegram alert) and race
# the sheet's clear+rewrite. Run back to back, the second finds nothing new.
concurrency:
  group: historical-scraper
  cancel-in-progress: false
jobs:
  historical:
    name: Historical Sheet (scraper.py)
    runs-on: ubuntu-latest
    # No browser install any more (fetch is plain HTTP with an on-demand
    # Lightpanda fallback) — the whole job normally finishes in ~1 minute.
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
        cache: 'pip'
    - name: Validate required secrets
      run: |
        if [ -z "${{ secrets.SPREADSHEET_ID }}" ]; then
          echo "Error: SPREADSHEET_ID secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.GOOGLE_CREDENTIALS }}" ]; then
          echo "Error: GOOGLE_CREDENTIALS secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.TELEGRAM_TOKEN }}" ]; then
          echo "Error: TELEGRAM_TOKEN secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
          echo "Error: TELEGRAM_CHAT_ID secret is not set"
          exit 1
        fi
        echo "All required secrets are present"
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --retries 5 --timeout 60 -r requirements.txt
    - name: Run Historical Scraper
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper.py
